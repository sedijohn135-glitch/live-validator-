[project]
name = "live-validator"
version = "1.0.0"
description = "Read-only IC Markets cTrader market data over MCP plus a live ICT v11 setup validator with Telegram alerts."
requires-python = "==3.12.*"
dependencies = [
    "mcp==2.2.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
